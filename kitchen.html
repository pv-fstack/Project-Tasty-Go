<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen KDS — TastyGo Display</title>
    <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <span class="brand-icon">⚡</span>
                <span class="brand-text">Tasty<span class="brand-accent">Go</span></span>
            </a>

            <div class="nav-links">
                <a href="index.html" class="nav-item">
                    <i class="fa-solid fa-utensils"></i> Order Menu
                </a>
                <a href="kitchen.html" class="nav-item active">
                    <i class="fa-solid fa-fire-burner"></i> Kitchen KDS
                </a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="hero-header" style="margin-bottom: 1.5rem; text-align: left; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 class="hero-title" style="font-size: 2rem;">👨‍🍳 Kitchen Display System (KDS)</h1>
                <p class="hero-subtitle">Single-tap controls push instant updates to student mobile tickets</p>
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center;">
                <button onclick="resetDefaults()" style="background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 600; font-size: 0.85rem; cursor: pointer;">
                    🔄 Reset Demo Orders
                </button>
                <div style="background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-emerald); padding: 0.5rem 1rem; border-radius: 30px; font-weight: 600; font-size: 0.9rem; color: var(--accent-emerald);">
                    <i class="fa-solid fa-signal"></i> Multi-Tab Live Sync
                </div>
            </div>
        </div>

        <div class="kds-container">
            <!-- Column 1: Placed / Incoming -->
            <div class="kds-column">
                <div class="col-header">
                    <span class="col-title"><i class="fa-solid fa-clock" style="color: var(--accent-amber);"></i> Incoming Orders</span>
                    <span class="order-count" id="countPlaced">0</span>
                </div>
                <div class="kds-cards" id="colPlaced"></div>
            </div>

            <!-- Column 2: Preparing -->
            <div class="kds-column">
                <div class="col-header">
                    <span class="col-title"><i class="fa-solid fa-fire-burner" style="color: var(--primary);"></i> In Kitchen</span>
                    <span class="order-count" id="countPreparing">0</span>
                </div>
                <div class="kds-cards" id="colPreparing"></div>
            </div>

            <!-- Column 3: Ready for Pickup -->
            <div class="kds-column">
                <div class="col-header">
                    <span class="col-title"><i class="fa-solid fa-bell" style="color: var(--accent-emerald);"></i> Ready for Pickup</span>
                    <span class="order-count" id="countReady">0</span>
                </div>
                <div class="kds-cards" id="colReady"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>⚡ TastyGo Live Queue — Personal Mobile Order Tracker</p>
        </div>
    </footer>

    <script src="js/audio.js"></script>
    <script src="js/app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        setupSoundButton();
        renderKDS();

        // Listen for multi-tab updates
        window.TastyGoApp.onSyncEvent((data) => {
            console.log("⚡ Kitchen Multi-Tab Event:", data);
            if (data.type === 'NEW_ORDER' && window.notifier) {
                window.notifier.playNewOrderSound();
            }
            renderKDS();
        });
    });

    function setupSoundButton() {
        const btn = document.createElement('button');
        btn.id = 'enableSoundBtn';
        btn.innerHTML = '🔔 Sound Alerts: Tap to Test';
        btn.style.cssText = 'position:fixed; bottom:20px; right:20px; z-index:999; padding:12px 18px; border-radius:30px; border:1px solid rgba(255,255,255,0.2); background:linear-gradient(135deg, #10b981 0%, #059669 100%); color:white; font-weight:700; font-size:0.88rem; cursor:pointer; box-shadow:0 10px 25px rgba(16,185,129,0.4); transition:all 0.3s ease;';
        document.body.appendChild(btn);

        btn.addEventListener('click', () => {
            if (window.notifier) {
                window.notifier.initAudio();
                window.notifier.playReadyChime(); // test bell chime!
            }
            btn.innerHTML = '✅ Sound Alerts Active';
            btn.style.background = 'rgba(16, 185, 129, 0.2)';
            btn.style.borderColor = 'var(--accent-emerald)';
            btn.style.color = 'var(--accent-emerald)';
        });
    }

    function renderKDS() {
        const orders = window.TastyGoApp.getOrders();

        const colPlaced = document.getElementById('colPlaced');
        const colPreparing = document.getElementById('colPreparing');
        const colReady = document.getElementById('colReady');

        colPlaced.innerHTML = '';
        colPreparing.innerHTML = '';
        colReady.innerHTML = '';

        let countPlaced = 0, countPreparing = 0, countReady = 0;

        orders.forEach(order => {
            if (order.status === 'COLLECTED' || order.status === 'CANCELLED') return;

            let itemsHtml = '';
            order.items.forEach(item => {
                itemsHtml += `
                    <li class="kds-item-row">
                        <span style="font-weight: 700; color: var(--primary);">${item.quantity}x</span>
                        <span>${item.name}</span>
                    </li>
                `;
            });

            let actionBtnHtml = '';
            if (order.status === 'PLACED') {
                countPlaced++;
                actionBtnHtml = `
                    <button class="btn-status-action btn-prepare" onclick="updateStatus('${order.token}', 'PREPARING')">
                        <i class="fa-solid fa-fire-burner"></i> Start Preparing
                    </button>
                `;
            } else if (order.status === 'PREPARING') {
                countPreparing++;
                actionBtnHtml = `
                    <button class="btn-status-action btn-ready" onclick="updateStatus('${order.token}', 'READY')">
                        <i class="fa-solid fa-bell"></i> Mark Ready (Alert Phone)
                    </button>
                `;
            } else if (order.status === 'READY') {
                countReady++;
                actionBtnHtml = `
                    <button class="btn-status-action btn-complete" onclick="updateStatus('${order.token}', 'COLLECTED')">
                        <i class="fa-solid fa-check"></i> Handed to Student
                    </button>
                `;
            }

            const cardHtml = `
                <div class="kds-card" id="card-${order.token}" style="${order.status === 'READY' ? 'border-color: var(--accent-emerald);' : ''}">
                    <div class="kds-card-header">
                        <span class="kds-token">${order.token}</span>
                        <span class="elapsed-time" style="${order.status === 'PREPARING' ? 'background: rgba(99, 102, 241, 0.2); color: var(--primary);' : (order.status === 'READY' ? 'background: rgba(16, 185, 129, 0.2); color: var(--accent-emerald);' : '')}">${order.created_at || 'Just now'}</span>
                    </div>
                    <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.8rem;">
                        <i class="fa-solid fa-user"></i> ${order.customer_name}
                        ${order.notes ? `<br><span style="color: var(--accent-amber);"><i class="fa-solid fa-comment"></i> "${order.notes}"</span>` : ''}
                    </div>
                    <ul class="kds-items">
                        ${itemsHtml}
                    </ul>
                    ${actionBtnHtml}
                </div>
            `;

            if (order.status === 'PLACED') colPlaced.innerHTML += cardHtml;
            else if (order.status === 'PREPARING') colPreparing.innerHTML += cardHtml;
            else if (order.status === 'READY') colReady.innerHTML += cardHtml;
        });

        document.getElementById('countPlaced').innerText = countPlaced;
        document.getElementById('countPreparing').innerText = countPreparing;
        document.getElementById('countReady').innerText = countReady;

        if (countPlaced === 0) colPlaced.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">No incoming orders</p>';
        if (countPreparing === 0) colPreparing.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">No orders preparing</p>';
        if (countReady === 0) colReady.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">No orders ready</p>';
    }

    function updateStatus(token, newStatus) {
        if (window.notifier) {
            window.notifier.initAudio();
            if (newStatus === 'READY') window.notifier.playReadyChime();
            else if (newStatus === 'PREPARING') window.notifier.playNewOrderSound();
        }
        window.TastyGoApp.updateOrderStatus(token, newStatus);
        renderKDS();
    }

    function resetDefaults() {
        if (confirm("Reset orders back to default (Dhoni, Hardik Pandya, John)?")) {
            window.TastyGoApp.resetToDefaults();
            renderKDS();
        }
    }
    </script>
</body>
</html>
